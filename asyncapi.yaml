asyncapi: 3.1.0
info:
    title: Noto — Centrifugo WebSocket
    version: 'latest'
    description: |
        Realtime entity create/update/delete notifications.
        Transport — Centrifugo (WebSocket), server-side publish only.

defaultContentType: application/json

servers:
    dev:
        host: localhost:8000
        protocol: ws
        description: Dev Centrifugo

channels:
    'noto-stashes:events':
        address: 'noto-stashes:events'
        description: Stash lifecycle events
        messages:
            stashEvent:
                $ref: '#/components/messages/stashEvent'

operations:
    onStashEvent:
        action: receive
        channel:
            $ref: '#/channels/noto-stashes:events'
        summary: Receive Stash event (created, updated, or deleted)

components:
    messages:
        stashEvent:
            summary: Stash lifecycle event
            payload:
                $ref: '#/components/schemas/stashEnvelope'

    schemas:
        stashEnvelope:
            required:
                - meta
                - data
            properties:
                meta:
                    $ref: '#/components/schemas/meta'
                data:
                    oneOf:
                        - $ref: '#/components/schemas/stash'
                        - $ref: '#/components/schemas/deletionPayload'
                    description: |
                        Full Stash DTO for created and updated events.
                        Only `{id}` for deleted events.
                        Discriminate by `meta.event`:
                        - created → Stash DTO
                        - updated → Stash DTO
                        - deleted → deletionPayload

        meta:
            required:
                - id
                - event
            properties:
                id:
                    type: string
                    format: uuid
                    description: Message UUID v7
                subject:
                    type: string
                    description: Human-readable summary text (reserved for push notifications)
                event:
                    type: string
                    enum: ['created', 'updated', 'deleted']
                    description: Event type

        deletionPayload:
            required:
                - id
            properties:
                id:
                    type: string
                    format: uuid
                    description: ID of the deleted entity

        stash:
            required:
                - id
                - type
                - createdAt
                - pinned
            properties:
                id:
                    type: string
                    format: uuid
                type:
                    type: string
                    enum: ['text', 'file']
                content:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                    nullable: true
                pinned:
                    type: boolean
                attachments:
                    type: array
                    nullable: true
                    items:
                        $ref: '#/components/schemas/attachment'

        attachment:
            required:
                - id
                - originFilename
                - mimeType
                - size
                - status
                - createdAt
            properties:
                id:
                    type: string
                    format: uuid
                originFilename:
                    type: string
                mimeType:
                    type: string
                size:
                    type: integer
                status:
                    type: string
                    enum: ['uploaded', 'pending']
                createdAt:
                    type: string
                    format: date-time
