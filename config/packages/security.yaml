security:
    providers:
        app_users:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        app:
            pattern: ^/(api|_mcp)
            stateless: true
            provider: app_users
            access_token:
                token_extractors: 'App\Security\HeaderOrCookieAccessTokenExtractor'
                token_handler:
                    oidc:
                        algorithms: ['RS256']
                        audience: '%env(OAUTH_AUDIENCE)%'
                        issuers: ['%env(OAUTH_ISSUER)%']
                        claim: email

    access_control:
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/(api|_mcp), roles: IS_AUTHENTICATED_FULLY }

# when@test can't just add "keyset" on top: config merges, so base "discovery" would stay and win.
# Each env sets its own instead.
when@dev: &oidc_discovery
    security:
        firewalls:
            app:
                access_token:
                    token_handler:
                        oidc:
                            discovery:
                                base_uri: '%env(OAUTH_ISSUER)%'
                                cache:
                                    id: cache.app

when@prod: *oidc_discovery

when@test:
    security:
        firewalls:
            app:
                access_token:
                    token_handler:
                        oidc:
                            keyset: '%env(OAUTH_TEST_JWKS)%'
