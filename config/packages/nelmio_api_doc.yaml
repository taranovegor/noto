when@dev:
    nelmio_api_doc:
        documentation:
            info:
                title: Noto
                description: Personal knowledge microservice for structured data storage
                version: '%env(string:VERSION)%'
            components:
                schemas:
                    Error:
                        type: object
                        properties:
                            type:
                                type: string
                                example: "https://tools.ietf.org/html/rfc2616#section-10"
                            title:
                                type: string
                                example: "An error occurred"
                            status:
                                type: integer
                                example: 400
                            detail:
                                type: string
                                example: "Bad Request"
                    ValidationError:
                        type: object
                        properties:
                            type:
                                type: string
                                example: "https://symfony.com/errors/validation"
                            title:
                                type: string
                                example: "Validation Failed"
                            status:
                                type: integer
                                example: 422
                            detail:
                                type: string
                                example: "note: This value should be of type string."
                            violations:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Violation'
                    Violation:
                        type: object
                        properties:
                            propertyPath:
                                type: string
                                example: "note"
                            title:
                                type: string
                                example: "This value should be of type string."
                            template:
                                type: string
                                example: "This value should be of type {{ type }}."
                            parameters:
                                type: object
                                example:
                                    "{{ type }}": "string"
                                    "hint": "string"
        html_config:
            stoplight_config:
                basePath: /api/doc
                router: memory
        areas:
            path_patterns:
                - ^/api(?!/doc$)
