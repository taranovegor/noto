parameters:
    app.name: 'noto'

    ai.additional_models:
        voyage-4-large:
            class: Symfony\AI\Platform\Bridge\Voyage\Voyage
            capabilities:
                - !php/const Symfony\AI\Platform\Capability::INPUT_MULTIPLE
                - !php/const Symfony\AI\Platform\Capability::EMBEDDINGS
        voyage-4:
            class: Symfony\AI\Platform\Bridge\Voyage\Voyage
            capabilities:
                - !php/const Symfony\AI\Platform\Capability::INPUT_MULTIPLE
                - !php/const Symfony\AI\Platform\Capability::EMBEDDINGS
        voyage-4-lite:
            class: Symfony\AI\Platform\Bridge\Voyage\Voyage
            capabilities:
                - !php/const Symfony\AI\Platform\Capability::INPUT_MULTIPLE
                - !php/const Symfony\AI\Platform\Capability::EMBEDDINGS

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude: '../src/{Dto,Entity,Exception,Kernel.php}'

    error_renderer:
        class: Symfony\Component\ErrorHandler\ErrorRenderer\SerializerErrorRenderer
        arguments:
            $format: 'json'

    ai.platform.model_catalog.voyage:
        class: Symfony\AI\Platform\Bridge\Voyage\ModelCatalog
        arguments:
            $additionalModels: '%ai.additional_models%'

    Symfony\AI\Store\Document\VectorizerInterface: '@ai.vectorizer.voyage'

    Symfony\AI\Store\StoreInterface: '@App\Service\Embedding\EmbeddingStore'

    ai.store.document.transformer.text_trim:
        class: Symfony\AI\Store\Document\Transformer\TextTrimTransformer

    ai.store.document.transformer.plain_text:
        class: App\Component\Ai\Store\Document\PlainTextTransformer

    ai.store.document.transformer.text_split:
        class: App\Component\Ai\Store\Document\TextSplitTransformer

    ai.store.document.indexable_entity_loader:
        class: App\Component\Ai\Store\Document\IndexableEntityLoader

    League\CommonMark\Extension\CommonMark\CommonMarkCoreExtension: ~

    League\CommonMark\Environment\EnvironmentInterface:
        class: League\CommonMark\Environment\Environment
        calls:
            - addExtension: ['@League\CommonMark\Extension\CommonMark\CommonMarkCoreExtension']

    League\CommonMark\ConverterInterface:
        class: League\CommonMark\CommonMarkConverter

    League\CommonMark\Parser\MarkdownParserInterface:
        class: League\CommonMark\Parser\MarkdownParser
        arguments:
            - '@League\CommonMark\Environment\EnvironmentInterface'

    storage.s3_client:
        class: 'AsyncAws\S3\S3Client'
        arguments:
            $configuration:
              {
                endpoint: '%env(S3_ENDPOINT)%',
                accessKeyId: '%env(S3_ACCESS_KEY_ID)%',
                accessKeySecret: '%env(S3_SECRET_ACCESS_KEY)%'
              }
            $httpClient: '@http_client'
            $logger: '@monolog.logger.s3'

    App\Component\Storage\ObjectStorage:
        arguments:
            $s3Client: '@storage.s3_client'
            $bucket: '%env(S3_BUCKET_ATTACHMENTS)%'

    storage.temp:
        class: App\Component\Storage\ObjectStorage
        arguments:
            $s3Client: '@storage.s3_client'
            $bucket: '%env(S3_BUCKET_TEMP)%'

    # Inject the throwaway bucket with a `ObjectStorage $tempStorage` parameter.
    App\Component\Storage\ObjectStorage $tempStorage: '@storage.temp'

    phpcent\Client:
        arguments:
            $url: '%env(CENTRIFUGO_API_URL)%'
            $apikey: '%env(CENTRIFUGO_API_KEY)%'
            $secret: '%env(CENTRIFUGO_SECRET)%'

    App\Component\Centrifugo\CentrifugalInterface: '@App\Component\Centrifugo\Centrifugo'

    App\Component\Centrifugo\EventSubscriber\AttachConnectionTokenOnAuthenticationSuccess:
        arguments:
            $centrifugoUrl: '%env(CENTRIFUGO_WS_URL)%'

    ai.http_client.psr18:
        class: Symfony\Component\HttpClient\Psr18Client

    App\Component\Ai\Client\AiClientFactory:
        arguments:
            $httpClient: '@ai.http_client.psr18'

    ai.client.extractor:
        class: OpenAI\Client
        factory: ['@App\Component\Ai\Client\AiClientFactory', 'fromDsn']
        arguments:
            $dsn: '%env(APP_EXTRACTOR_DSN)%'

    ai.client.transcriber:
        class: OpenAI\Client
        factory: ['@App\Component\Ai\Client\AiClientFactory', 'fromDsn']
        arguments:
            $dsn: '%env(APP_TRANSCRIBER_DSN)%'

    App\Component\Ai\Extractor\Extractor:
        arguments:
            $openai: '@ai.client.extractor'
            $model: '%env(key:model:query_string:APP_EXTRACTOR_DSN)%'

    App\Component\Ai\Transcriber\Transcriber:
        arguments:
            $openai: '@ai.client.transcriber'
            $model: '%env(key:model:query_string:APP_TRANSCRIBER_DSN)%'

    FFMpeg\FFProbe:
        factory: ['FFMpeg\FFProbe', 'create']

    FFMpeg\FFMpeg:
        factory: ['FFMpeg\FFMpeg', 'create']
        arguments:
            $probe: '@FFMpeg\FFProbe'

    App\Component\Broadcaster\Broadcaster:
        arguments:
            $namespacePrefix: '%app.name%'

    App\Component\Broadcaster\BroadcasterInterface: '@App\Component\Broadcaster\Broadcaster'
